name: Build

on:
  push:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "smart-water-controller-schedule-card.js"
      - "package.json"
      - "package-lock.json"
      - "webpack.config.js"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "smart-water-controller-schedule-card.js"
      - "package.json"
      - "package-lock.json"
      - "webpack.config.js"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Before the build: `npm run build` rewrites the bundle, so checking after
      # it could never see a stale committed bundle.
      - name: Check the build is complete, deterministic and committed
        run: npm run check

      - name: Run the schedule card tests
        run: npm test

      - name: Build card
        run: npm run build
